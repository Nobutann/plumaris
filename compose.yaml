services:
  mysql:
    image: mysql:8.4.13
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: adocao_bd
      MYSQL_USER: plumaris
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_criacao_tabelas.sql:/docker-entrypoint-initdb.d/01_criacao_tabelas.sql:ro
      - ./database/02_insercao_dados.sql:/docker-entrypoint-initdb.d/02_insercao_dados.sql:ro
      - ./database/04_indices.sql:/docker-entrypoint-initdb.d/04_indices.sql:ro
      - ./database/05_visoes.sql:/docker-entrypoint-initdb.d/05_visoes.sql:ro
      - ./database/07_funcoes.sql:/docker-entrypoint-initdb.d/07_funcoes.sql:ro
      - ./database/08_procedimentos.sql:/docker-entrypoint-initdb.d/08_procedimentos.sql:ro
      - ./database/09_triggers.sql:/docker-entrypoint-initdb.d/09_triggers.sql:ro
  backend:
    image: plumaris-backend
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/adocao_bd
      DB_USERNAME: plumaris
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    image: plumaris-frontend
    build: ./frontend
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
volumes:
  mysql_data:
  frontend_node_modules: